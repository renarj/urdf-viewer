name: Build and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Java and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Java tests
        run: mvn -B -ntp test

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Run browser geometry tests
        run: |
          npm ci --ignore-scripts
          npm test

  docker:
    name: Verify container
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Keep build summaries, without storing a downloadable build record per run.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: urdf-viewer:smoke-test
          cache-from: type=gha,scope=urdf-viewer-amd64
          cache-to: type=gha,scope=urdf-viewer-amd64,mode=max

      - name: Smoke-test application and storage
        run: |
          trap 'docker rm -fv urdf-viewer-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name urdf-viewer-smoke \
            --publish 127.0.0.1:8081:8081 urdf-viewer:smoke-test
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8081/api/models >/dev/null; then
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8081/ >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs urdf-viewer-smoke
          echo '::error::The container did not become ready.'
          exit 1

  publish:
    name: Publish to Docker Hub
    needs: docker
    if: github.event_name == 'push' && github.repository == 'renarj/urdf-viewer'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev-build
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as secrets in the dev-build environment. See docs/development.md.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: renarj/urdf-viewer
          tags: |
            type=edge,branch=main
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=urdf-viewer-amd64
            type=gha,scope=urdf-viewer-multi
          cache-to: type=gha,scope=urdf-viewer-multi,mode=max
