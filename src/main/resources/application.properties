spring.application.name=urdf-viewer
server.port=8081
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=512MB
spring.thymeleaf.cache=false

urdf.viewer.storage-dir=./data/urdf-viewer
urdf.viewer.max-upload-bytes=134217728
urdf.viewer.max-extracted-bytes=268435456
urdf.viewer.max-file-bytes=67108864
urdf.viewer.max-files=1000
urdf.viewer.max-meshes=300
urdf.viewer.max-stl-bytes=268435456
urdf.viewer.max-triangles=5000000
